name: Web (Admin + PWA)
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Find www folder
        run: |
          W=$(find . -type d -name www -not -path "*/node_modules/*" | head -1)
          echo "WWW=$W" >> $GITHUB_ENV
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WWW }}
      - id: deployment
        uses: actions/deploy-pages@v4
