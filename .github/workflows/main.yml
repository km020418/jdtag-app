name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          P=$(find . -name package.json -not -path "*/node_modules/*" -not -path "./.git/*" | head -1)
          if [ -z "$P" ]; then echo "::error::package.json을 찾지 못했어요"; find . -maxdepth 3 -not -path "./.git*"; exit 1; fi
          echo "APP_DIR=$(dirname "$P")" >> $GITHUB_ENV
          echo "프로젝트 위치: $(dirname "$P")"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund
      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npm run setup -- android
      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JDTag-android-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
