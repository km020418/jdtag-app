name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          if [ -f package.json ]; then echo "APP_DIR=." >> $GITHUB_ENV;
          elif [ -f jdtag-app/package.json ]; then echo "APP_DIR=jdtag-app" >> $GITHUB_ENV;
          else echo "::error::package.json을 찾지 못했어요. 파일이 업로드됐는지 확인해 주세요."; ls -la; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund
      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npm run setup -- android
      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JDTag-android-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
