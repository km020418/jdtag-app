<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E0F12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JD Tag">
<title>JD Tag</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{
  --ink:#0E0F12;--ink2:#1A1C22;--blue:#0064FF;--blue2:#0047D6;--soft:#E6EEFF;--canvas:#F2F3F5;
  --green:#12B76A;--red:#F04438;--redsoft:#FDE7E7;--amber:#F5A524;--g1:#8B8F98;--g2:#5B5F68;--g3:#C9CCD2;--line:#ECEDF0;
  --r-sm:14px;--r:20px;--r-lg:28px;
  --font:'Inter','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#D9DCE1;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;border:0;outline:0;background:none;width:100%}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--canvas);overflow:hidden}
@media (min-width:600px){
  #phone{width:393px;height:852px;border-radius:48px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.35)}
  #stage{padding:30px 0}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas);overflow:hidden}
.screen.dark{background:var(--ink);color:#fff}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.pb-nav{padding-bottom:120px}
.pb-btn{padding-bottom:110px}
/* transitions */
.enter-fwd{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
.enter-back{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
.enter-fade{animation:fadeIn .3s ease}
.enter-up{animation:inUp .36s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-30%);opacity:0}to{transform:none;opacity:1}}
@keyframes inUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* top bar */
.topbar{height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;position:relative}
.topbar .ttl{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:700}
.ibtn{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative;flex-shrink:0}
.dark .ibtn{background:rgba(255,255,255,.1);color:#fff}
.ibtn .dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.dark .ibtn .dot{border-color:var(--ink2)}
.ibtn svg{width:20px;height:20px}
.steps{display:flex;gap:4px}
.steps i{width:14px;height:5px;border-radius:3px;background:var(--g3)}
.steps i.on{width:22px;background:var(--ink)}
/* type */
.over{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}
.over.g{color:var(--g1)}
.h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:13.5px;color:var(--g2);margin-top:6px;line-height:1.5}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.sec-h b{font-size:17px;font-weight:800}
.sec-h a,.link{color:var(--blue);font-size:13.5px;font-weight:700;cursor:pointer}
.label-sm{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--g1);margin:22px 4px 10px}
/* buttons */
.btn{height:56px;border-radius:28px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff}
.btn.black{background:var(--ink);color:#fff}
.btn.white{background:#fff;color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--soft);color:var(--blue)}
.btn.outline{background:#fff;border:1px solid var(--line)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:20px;height:20px}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 28px;background:linear-gradient(transparent,var(--canvas) 30%);display:flex;flex-direction:column;gap:10px;z-index:5}
.dark .bottom{background:linear-gradient(transparent,var(--ink) 30%)}
.bottom .row{display:flex;gap:10px}
.bottom .row .btn{flex:1}
/* fields */
.field{margin-top:18px}
.field>label{display:block;font-size:13px;font-weight:700;margin:0 2px 8px}
.inp{height:54px;border-radius:18px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:8px;border:1.5px solid transparent;transition:border .15s}
.inp:focus-within{border-color:var(--blue)}
.inp.err{border-color:var(--red)}
.inp.ok{border-color:var(--blue)}
.inp input{font-size:15.5px;font-weight:500}
.inp input::placeholder{color:#B4B8C0;font-weight:400}
.inp .act{color:var(--blue);font-size:13px;font-weight:700;white-space:nowrap}
.inp .timer{color:var(--blue);font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--g1);margin:8px 4px 0}
.hint.err{color:var(--red)}
.two{display:flex;gap:10px}.two>*{flex:1}
/* segmented */
.seg{display:flex;background:#E4E6EA;border-radius:18px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:14px;font-size:14px;font-weight:600;color:var(--g2)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{height:34px;padding:0 15px;border-radius:17px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
/* cards / list */
.card{background:#fff;border-radius:24px}
.list{background:#fff;border-radius:24px;padding:0 16px}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{display:block;font-size:12.5px;color:var(--g1);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta{font-size:12.5px;color:var(--g1);white-space:nowrap}
.li .chev{width:16px;height:16px;color:var(--g3);flex-shrink:0}
.li.menu{padding:18px 0}
.li.menu .tx b{font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid var(--line);gap:12px}
.kv:last-child{border-bottom:0}
.kv b{font-size:14.5px;font-weight:700;white-space:nowrap}
.kv span{font-size:13.5px;color:var(--g2);text-align:right}
.kv.light b{font-weight:500;color:var(--g2);font-size:13.5px}
.kv.light span{font-weight:700;color:var(--ink);font-size:14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.av.blue{background:var(--blue);color:#fff}
.av.lg{width:72px;height:72px;font-size:26px}
.av.ink{background:var(--ink);color:#fff}
/* business card */
.bcard{position:relative;border-radius:24px;padding:22px 20px;color:#fff;aspect-ratio:1.7/1;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:linear-gradient(135deg,#1F7BFF 0%,#0050E6 50%,#0036B8 100%);box-shadow:0 12px 30px rgba(0,80,230,.25)}
.bcard.dark{background:linear-gradient(135deg,#2A2D35 0%,#16181D 60%,#0E0F12 100%);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.bcard.slate{background:linear-gradient(135deg,#5B6272 0%,#3A3F4B 60%,#2A2E37 100%);box-shadow:0 12px 30px rgba(0,0,0,.2)}
.bcard::after{content:'';position:absolute;right:-30%;top:-40%;width:90%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.14),transparent);pointer-events:none}
.bcard .nm{font-size:24px;font-weight:800;letter-spacing:-.02em}
.bcard .en{font-size:12px;opacity:.75;margin-top:4px}
.bcard .co{font-size:13.5px;font-weight:700}
.bcard .ct{font-size:11.5px;opacity:.75;margin-top:5px}
.bcard .jd{position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:11px;font-weight:800}
.bcard .tag{display:inline-block;margin-top:10px;padding:4px 9px;border-radius:10px;background:rgba(255,255,255,.2);font-size:11px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;font-weight:700}
.pill.soft{background:var(--soft);color:var(--blue)}
.pill.red{background:var(--redsoft);color:var(--red)}
.pill.ink{background:var(--ink);color:#fff}
.pill.white{background:#fff}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--green)}
/* tab bar */
.tabbar{position:absolute;left:20px;right:20px;bottom:24px;height:60px;border-radius:32px;background:var(--ink);display:flex;align-items:center;padding:0 6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.tabbar{transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .3s}
.tabbar.hidden{transform:translateY(130%);opacity:0;pointer-events:none}
.tabbar button{flex:1 1 0;height:48px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:0;color:#8E929B;font-size:14px;font-weight:700;background:rgba(255,255,255,0);transition:flex-grow .45s cubic-bezier(.22,1,.36,1),background-color .35s,color .35s,gap .45s cubic-bezier(.22,1,.36,1)}
.tabbar button span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .45s cubic-bezier(.22,1,.36,1),opacity .3s}
.tabbar button.on span{max-width:60px;opacity:1}
.tabbar button.on{gap:7px}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{background:#fff;color:var(--ink);flex-grow:1.35}
/* result */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px 0}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:#D8E4FA;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.ring>div{width:96px;height:96px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff}
.ring svg{width:44px;height:44px}
.ring.red{background:#F3DFE0}.ring.red>div{background:var(--red)}
.ring.gray{background:#E2E4E8}.ring.gray>div{background:#8E95A3}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.result .h2{margin-top:28px;font-size:24px}
.result .sub{margin-top:8px}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(14,15,18,.5);z-index:50;animation:fadeIn .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 30px;z-index:51;animation:inUp .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:#D6D8DD;margin:0 auto 18px}
.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 0;margin-top:20px}
.share-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700}
.share-grid i{width:60px;height:60px;border-radius:20px;display:grid;place-items:center}
.share-grid i svg{width:22px;height:22px}
/* toast */
.toast{position:absolute;left:20px;right:20px;top:54px;z-index:80;background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .35s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.toast.out{animation:toastOut .3s forwards}
.toast .av{width:36px;height:36px;font-size:13px}
.toast b{font-size:14px;display:block}.toast span{font-size:12px;opacity:.7}
@keyframes toastIn{from{transform:translateY(-120%)}to{transform:none}}
@keyframes toastOut{to{transform:translateY(-140%);opacity:0}}
.snack{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(14,15,18,.92);color:#fff;font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:16px;z-index:90;white-space:nowrap;animation:fadeIn .2s}
/* toggle */
.tg{width:52px;height:32px;border-radius:16px;background:#D3D6DB;position:relative;transition:background .2s;flex-shrink:0}
.tg::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--blue)}.tg.on::after{transform:translateX(20px)}
/* radio option */
.opt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:18px;border:2px solid transparent;cursor:pointer;margin-bottom:12px;transition:border .15s}
.opt.on{border-color:var(--blue)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #C5C9D0;flex-shrink:0;position:relative}
.opt.on .rd{border-color:var(--blue);background:var(--blue)}
.opt.on .rd::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
.opt b{display:block;font-size:15.5px;font-weight:800}
.opt span{display:block;font-size:12.5px;color:var(--g1);margin-top:3px}
/* bottom summary bar */
.sumbar{position:absolute;left:20px;right:20px;bottom:24px;height:72px;border-radius:26px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 10px 0 20px;z-index:10}
.sumbar .t{flex:1}.sumbar b{font-size:15px;display:block}.sumbar span{font-size:12px;opacity:.6}
.sumbar .btn{width:auto;height:52px;padding:0 24px;border-radius:20px}
/* misc */
.notice-bar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;height:46px;padding:0 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.notice-bar .bd{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.notice-bar svg{width:16px;height:16px;margin-left:auto;color:var(--g2)}
.empty{text-align:center;color:var(--g1);font-size:13.5px;padding:40px 0}
.spacer{height:20px}

/* motion polish */
.screen{will-change:transform}
.btn,.ibtn,.chip,.opt,.li,.card,[data-go],[data-act],.tabbar button,.share-grid button{transition:transform .22s cubic-bezier(.22,1,.36,1),background-color .2s,border-color .2s,opacity .2s,box-shadow .2s}
.btn:active,.ibtn:active,.chip:active,.opt:active,div[data-go]:active,.share-grid button:active,.tabbar button:active{transform:scale(.965)}
.li:active{background:#F6F7F9}
.ring{animation:pop2 .7s cubic-bezier(.22,1,.36,1) both}
.ring>div{animation:pop2 .7s .08s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop2{0%{transform:scale(.5);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.ring svg.draw path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .55s .35s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.snack{animation:snackIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes snackIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.sheet{animation:sheetIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.toast{animation:toastIn .55s cubic-bezier(.34,1.4,.64,1)}
.opt .rd,.opt .rd::after{transition:all .25s cubic-bezier(.22,1,.36,1)}
.tg::after{transition:transform .35s cubic-bezier(.34,1.4,.64,1)}
.tg{transition:background-color .3s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* card stack */
.stack{position:relative;height:286px;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.sc{position:absolute;height:208px;border-radius:24px;overflow:hidden;cursor:pointer;
  transition:left .5s cubic-bezier(.3,1.15,.5,1),top .5s cubic-bezier(.3,1.15,.5,1),width .5s cubic-bezier(.3,1.15,.5,1),opacity .5s ease,transform .5s cubic-bezier(.3,1.15,.5,1),box-shadow .5s;
  box-shadow:0 2px 8px rgba(14,15,18,.08)}
.sc.front{box-shadow:0 14px 34px rgba(0,60,180,.22)}
.sc.is-add{border:1.5px dashed #9DBBF5}
.sc-peek{position:absolute;left:16px;top:7px;font-size:12px;font-weight:700;color:#fff;transition:opacity .3s}
.sc-body{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}
.sc.front .sc-body{opacity:1;transition:opacity .35s .12s ease}
.sc.front .sc-peek{opacity:0}
.sc .bcard{border-radius:24px;box-shadow:none}
.sc-add{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff}
.sc-add b{font-size:16px;margin-top:8px}.sc-add span:last-child{font-size:12.5px;color:var(--g2)}
.sc-plus{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--blue);display:grid;place-items:center}
.pager{display:flex;justify-content:center;gap:5px;margin-top:18px}
.pager i{width:6px;height:6px;border-radius:3px;background:#C9CCD2;cursor:pointer;transition:width .4s cubic-bezier(.22,1,.36,1),background .3s}
.pager i.on{width:22px;background:var(--ink)}

/* installed (home-screen) app: respect notch / home indicator */
/* installed app (home-screen PWA or native): respect notch / home indicator */
html.standalone,html.standalone body{background:var(--canvas);overscroll-behavior:none}
html.standalone body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.standalone input,html.standalone textarea{-webkit-user-select:text;user-select:text}
html.standalone #phone{height:100vh;height:100dvh;max-width:none;border-radius:0;box-shadow:none}
html.standalone .screen{padding-top:max(0px,calc(env(safe-area-inset-top) - 40px))}
html.standalone .tabbar{bottom:max(12px,calc(env(safe-area-inset-bottom) - 12px))}
html.standalone .sumbar{bottom:max(12px,calc(env(safe-area-inset-bottom) - 12px))}
html.standalone .bottom{padding-bottom:max(28px,calc(env(safe-area-inset-bottom) + 12px))}
html.standalone .sheet{padding-bottom:max(30px,calc(env(safe-area-inset-bottom) + 14px))}
html.standalone .toast{top:calc(env(safe-area-inset-top) + 8px)}
html.android .screen{top:-26px}

@media (max-width:599px){.tabbar{bottom:14px}.sumbar{bottom:14px}}
/* ===== PC Admin Console ===== */
body.console-mode{background:var(--canvas)}
body.console-mode #stage{display:block;padding:0;min-height:100vh}
body.console-mode #phone{display:none}
body.console-mode.split #phone{display:block;position:fixed;right:24px;top:50%;transform-origin:right center;z-index:40;border-radius:48px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.35)}
#console{display:flex;min-height:100vh}
.sb{width:240px;flex-shrink:0;background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 16px 16px}
.sb .logo{display:flex;align-items:center;gap:10px;padding:0 10px}
.sb .logo i{width:32px;height:32px;border-radius:9px;background:var(--blue);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.sb .logo b{font-size:16px;display:block;line-height:1.1}.sb .logo span{font-size:10.5px;opacity:.55}
.sb .mlabel{font-size:10.5px;font-weight:700;letter-spacing:.14em;opacity:.45;margin:30px 10px 10px}
.sb nav button{display:flex;align-items:center;gap:12px;width:100%;height:42px;border-radius:12px;padding:0 12px;color:#C9CCD2;font-size:14px;font-weight:600;transition:background .2s,color .2s}

function render(anim){
  clearTimers();stopTone();
  const cur=hist[hist.length-1];
  const out=R[cur.name](cur.params||{});
  const el=document.createElement('div');
  el.className='screen '+(out.cls||'');
  el.innerHTML=out.html;
  const old=$$('.screen:not(.leaving)',phone());
  const oldScroll=old[0]&&$('.scroll',old[0])?$('.scroll',old[0]).scrollTop:0;
  $$('.dim,.sheet',phone()).forEach(o=>o.remove());
  const nav=ensureNav();phone().insertBefore(el,nav);
  bind(el);
  out.after&&out.after(el);
  setNav(out.tab);
  if(!window.CONSOLE_ON){try{history.replaceState(null,'','#'+(cur.name==='settings'?'app-settings':cur.name))}catch(e){}}
  if(anim==='none'||!anim||reduce||!old.length){
    if(anim==='none'&&$('.scroll',el))$('.scroll',el).scrollTop=oldScroll;
    old.forEach(o=>o.remove());return;
  }
  old.forEach(o=>{o.classList.add('leaving');o.style.pointerEvents='none'});
  const D=anim==='tab'?260:anim==='fade'?340:460;
  const done=()=>old.forEach(o=>o.remove());
  let a;
  if(anim==='fwd'){
    el.style.zIndex=3;el.style.boxShadow='-10px 0 40px rgba(0,0,0,.12)';
    a=el.animate([{transform:'translateX(100%)'},{transform:'translateX(0)'}],{duration:D,easing:EASE});
    old.forEach(o=>o.animate([{transform:'translateX(0)',filter:'brightness(1)'},{transform:'translateX(-28%)',filter:'brightness(.88)'}],{duration:D,easing:EASE,fill:'forwards'}));
    a.onfinish=()=>{el.style.boxShadow='';el.style.zIndex='';done()};
  }else if(anim==='back'){
    old.forEach(o=>{o.style.zIndex=3;o.style.boxShadow='-10px 0 40px rgba(0,0,0,.12)';o.animate([{transform:'translateX(0)'},{transform:'translateX(100%)'}],{duration:D,easing:EASE,fill:'forwards'})});
    a=el.animate([{transform:'translateX(-28%)',filter:'brightness(.88)'},{transform:'translateX(0)',filter:'brightness(1)'}],{duration:D,easing:EASE});
    a.onfinish=done;
  }else{ // fade / tab / up
    el.style.zIndex=3;
    const from=anim==='up'?'translateY(40px)':anim==='tab'?'translateY(6px)':'scale(.985)';
    a=el.animate([{opacity:0,transform:from},{opacity:1,transform:'none'}],{duration:D,easing:EASE});
    old.forEach(o=>o.animate([{opacity:1},{opacity:0}],{duration:D*.8,easing:'ease',fill:'forwards'}));
    a.onfinish=()=>{el.style.zIndex='';done()};
  }
  // gentle stagger for content
  const kids=$$('.scroll > *',el).slice(0,9);
  kids.forEach((k,i)=>k.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:520,delay:70+i*38,easing:EASE,fill:'backwards'}));
  const btm=$('.bottom, .sumbar',el);if(btm)btm.animate([{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],{duration:500,delay:160,easing:EASE,fill:'backwards'});
}
function go(name,params,anim='fwd'){hist.push({name,params});render(anim)}
function replace(name,params,anim='fade'){hist[hist.length-1]={name,params};render(anim)}
function reset(name,params,anim='fade'){hist=[{name,params}];render(anim)}
function back(){if(hist.length>1){hist.pop();render('back')}else reset('home')}
function tabGo(name){if(hist[hist.length-1].name===name)return;reset(name,{},'tab')}

    if(m==='reset')reset(b.dataset.go,p);else if(m==='replace')replace(b.dataset.go,p);else if(m==='tab')tabGo(b.dataset.go);else go(b.dataset.go,p)}));
  $$('[data-back]',root).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();back()}));
  $$('[data-act]',root).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();A[b.dataset.act](b,e)}));
}

/* ===== Sound key tone (Web Audio) ===== */
let AC=null,osc=[];
function playTone(){
  try{
    if(!S.settings.sfx){if(S.settings.vibe&&navigator.vibrate)navigator.vibrate([80,60,80]);return}
    actx();stopTone();
    const g=AC.createGain();g.gain.value=0.0001;g.connect(AC.destination);
    const freqs=[1760,2093,2637,2093];let t=AC.currentTime;
    const o=AC.createOscillator();o.type='sine';o.connect(g);
    for(let i=0;i<24;i++){o.frequency.setValueAtTime(freqs[i%4],t+i*0.12)}
    g.gain.exponentialRampToValueAtTime(0.06,t+0.05);
    o.start();osc=[o,g];
    if(S.settings.vibe&&navigator.vibrate)navigator.vibrate([80,60,80]);
  }catch(e){}
}
function stopTone(){try{if(osc[0]){osc[1].gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.05);osc[0].stop(AC.currentTime+0.06)}}catch(e){}osc=[]}

/* ===== SFX + Haptics ===== */
if(S.settings.sfx===undefined)S.settings.sfx=true;
if(S.settings.haptic===undefined)S.settings.haptic=true;
function actx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
document.addEventListener('pointerdown',()=>actx(),{capture:true,passive:true});
function note(f,t0,dur,{type='sine',vol=.08,attack=.005,f2=null}={}){const c=AC;const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.02)}
function noise(t0,dur,{from=400,to=3000,vol=.12,q=1.2}={}){const c=AC;const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const src=c.createBufferSource();src.buffer=buf;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;
  bp.frequency.setValueAtTime(from,t0);bp.frequency.exponentialRampToValueAtTime(to,t0+dur);const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+dur*.35);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(bp);bp.connect(g);g.connect(c.destination);src.start(t0);src.stop(t0+dur+.02)}
const SFX={
  tick(t){note(1800,t,.04,{vol:.035})},
  toggle(t){note(1400,t,.05,{vol:.04});note(2100,t+.04,.05,{vol:.03})},
  whoosh(t){noise(t,.42,{from:300,to:4200,vol:.18});note(520,t+.05,.35,{type:'sine',vol:.05,f2:1400})},
  found(t){note(1320,t,.18,{vol:.05});note(1760,t+.09,.25,{vol:.04})},
  success(t){[1047,1319,1568].forEach((f,i)=>note(f,t+i*.085,.38,{type:'triangle',vol:.09}));note(2093,t+.26,.6,{vol:.04})},
  fail(t){note(392,t,.16,{type:'triangle',vol:.1});note(311,t+.17,.3,{type:'triangle',vol:.1})},
  receive(t){note(1568,t,.5,{vol:.08});note(2349,t+.12,.7,{vol:.06});note(3136,t+.12,.4,{vol:.015})},
  notify(t){note(1175,t,.3,{vol:.07});note(1760,t+.1,.45,{vol:.06})},
  saved(t){note(880,t,.12,{type:'triangle',vol:.07});note(1320,t+.08,.25,{type:'triangle',vol:.07})},
  remove(t){note(220,t,.18,{type:'sine',vol:.14,f2:110});noise(t,.12,{from:800,to:200,vol:.06})},
  entry(t){[784,1047,1319,1568].forEach((f,i)=>note(f,t+i*.07,.45,{type:'triangle',vol:.08}));note(2093,t+.3,.8,{vol:.035})},
};
const HAP={tap:8,tick:10,toggle:12,whoosh:[12,30,28],found:[20,40,20],success:[25,50,70],fail:[70,50,70,50,70],receive:[30,60,30,60,40],notify:30,saved:20,remove:[40,30,20],entry:[30,50,30,50,90]};
function fx(name,{sound=true,haptic=true}={}){
  if(sound&&S.settings.sfx&&SFX[name]){const c=actx();if(c){try{SFX[name](c.currentTime+.01)}catch(e){}}}

let walletFront=null; // index in stack items (cards + add)
const SLOTS=[ // back -> front, from Figma (container 353 wide)
  {x:24,y:0,w:305,op:.9},{x:16,y:24,w:321,op:.95},{x:8,y:50,w:337,op:1},{x:0,y:78,w:353,op:1}];
function stackItems(){return [...S.myCards.map(c=>({kind:'card',id:c.id})),{kind:'add'}]}
function peekLabel(it){if(it.kind==='add')return '<span style="color:var(--blue)">+ 새 명함 추가</span>';const c=cardData(it.id);return c.type==='basic'?'기본 명함':(c.short||c.label)}
function peekBg(it){if(it.kind==='add')return '#fff';const st=cardData(it.id).style;return st==='dark'?'linear-gradient(135deg,#2A2D35,#16181D)':st==='slate'?'linear-gradient(135deg,#6A7182,#4A505E)':'linear-gradient(135deg,#2B7FFF,#0A5AF0)'}
function stackCardHTML(it,i){
  const front=it.kind==='add'
    ?`<div class="sc-add"><span class="sc-plus">${ic('plus','style="width:22px;height:22px"',2.4)}</span><b>새 명함 추가</b><span>최대 5개까지 만들 수 있어요 · ${S.myCards.length} / 5</span></div>`
    :bcard({...cardData(it.id),tagLabel:cardData(it.id).type==='basic'?'기본 명함':(cardData(it.id).short||cardData(it.id).label)},'style="height:100%;aspect-ratio:auto"');
  return `<div class="sc ${it.kind==='add'?'is-add':''}" data-i="${i}" style="background:${peekBg(it)}"><div class="sc-peek">${peekLabel(it)}</div><div class="sc-body">${front}</div></div>`;
}
function layoutStack(root,animate=true){
  const items=stackItems(),N=items.length,box=$('.stack',root);if(!box)return;
  const W=box.clientWidth||353,k=W/353;
  $$('.sc',box).forEach(el=>{const i=+el.dataset.i,d=(i-walletFront+N)%N;
    let slot=d===0?3:d===1?2:d===2?1:d===3?0:-1;const S0=SLOTS[Math.max(slot,0)];
    if(!animate)el.style.transition='none';
    el.style.left=(S0.x*k)+'px';el.style.top=S0.y+'px';el.style.width=(S0.w*k)+'px';
    el.style.opacity=slot<0?0:S0.op;el.style.zIndex=slot<0?0:slot+1;el.style.pointerEvents=slot<0?'none':'auto';
    el.classList.toggle('front',d===0);
    if(!animate){el.offsetHeight;el.style.transition=''}
  });
  $$('.pager i',root).forEach((d,i)=>d.classList.toggle('on',i===walletFront));
  const it=items[walletFront];if(it.kind==='card'&&S.sendCard!==it.id){S.sendCard=it.id;save();setPresence()}
  const sb=$('#walletSend',root);if(sb)sb.dataset.p=JSON.stringify({id:S.sendCard});
}
function setFront(root,i){const N=stackItems().length;i=(i+N)%N;if(i===walletFront)return;walletFront=i;fx('tick');layoutStack(root)}
R.wallet=()=>{

</div>`,after(el){
    layoutStack(el,false);
    const box=$('.stack',el);let y0=null,x0=0,dy=0,moved=false,pid=null,frontEl=null;
    box.addEventListener('pointerdown',e=>{y0=e.clientY;x0=e.clientX;dy=0;moved=false;pid=e.pointerId;frontEl=$('.sc.front',box)});
    box.addEventListener('pointermove',e=>{if(e.pointerId!==pid||y0===null)return;dy=e.clientY-y0;
      if(!moved&&Math.abs(dy)>8&&Math.abs(dy)>Math.abs(e.clientX-x0)){moved=true;box.setPointerCapture(pid);frontEl.style.transition='none'}
      if(moved){e.preventDefault();frontEl.style.transform=`translateY(${dy*0.45}px) rotate(${dy*-0.02}deg)`}});
    const end=e=>{if(y0===null)return;y0=null;if(!moved)return;
      frontEl.style.transition='';frontEl.style.transform='';
      if(dy<-40)setFront(el,walletFront+1);else if(dy>40)setFront(el,walletFront-1);
      box._suppress=true;setTimeout(()=>box._suppress=false,50)};
    box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
    box.addEventListener('click',e=>{if(box._suppress)return;const c=e.target.closest('.sc');if(!c)return;const i=+c.dataset.i;

    $$('.pager i',el).forEach(d=>d.addEventListener('click',()=>setFront(el,+d.dataset.i)));
  }};
};

A.shareVia=async b=>{const k=b.dataset.k,u=b.dataset.u,n=b.dataset.n;
  if(k==='메일'){location.href=`mailto:?subject=${encodeURIComponent(n+' 명함')}&body=${encodeURIComponent(u)}`;return}

function qrSheet(u){
  // decorative pseudo-QR (deterministic pattern)
  let cells='';let h=0;for(const ch of u)h=(h*31+ch.charCodeAt(0))>>>0;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on;
    if(f){const lx=x>13?x-14:x,ly=y>13?y-14:y;on=lx===0||lx===6||ly===0||ly===6||(lx>1&&lx<5&&ly>1&&ly<5)}
    else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}
    if(on)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  sheet(`<div class="h2" style="text-align:center">QR 코드로 공유</div><div class="sub" style="text-align:center">상대방이 카메라로 스캔하면 명함이 열려요.</div>

  <div style="text-align:center;font-size:13px;color:var(--blue);font-weight:700">${u.replace('https://','')}</div>
  <button class="btn black" style="margin-top:20px" data-act="closeSheet">닫기</button>`);
}

  <div id="peerPill" class="pill" style="position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.1);color:#fff;height:30px;padding:0 14px;font-size:12.5px;white-space:nowrap"><i class="d"></i>주변 기기 찾는 중</div><span style="width:44px"></span></div>
<div style="position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0">
  <div id="peerBox" style="min-height:92px;flex-shrink:0;text-align:center;padding-top:6px;opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s cubic-bezier(.22,1,.36,1)"></div>
  <div style="flex:1.2;min-height:24px;max-height:110px"></div>
  <div style="padding:0 32px;flex-shrink:0"><div id="swipeCard" style="transform:rotate(-6deg);transition:transform .35s cubic-bezier(.2,.8,.2,1);touch-action:none;cursor:grab;user-select:none;position:relative;z-index:4">${bcard(c)}</div></div>
  <div id="swipeTxt" style="text-align:center;margin-top:44px;flex-shrink:0;transition:opacity .2s">
    <div style="font-size:24px;font-weight:800">위로 밀어서 보내기</div><div style="font-size:13px;opacity:.6;margin-top:8px">화면 어디서든 위로 밀면 상대방에게 바로 전달돼요</div></div>
  <div style="flex:1;min-height:20px"></div>
  <div style="display:flex;flex-direction:column;align-items:center;opacity:.8;cursor:pointer;padding-bottom:34px;flex-shrink:0" data-act="autoSend">
    <span style="opacity:.3">${ic('up','style="width:20px;height:20px"')}</span><span style="opacity:.6;margin-top:-6px">${ic('up','style="width:20px;height:20px"')}</span><span style="margin-top:-6px">${ic('up','style="width:20px;height:20px"')}</span>
    <div style="width:100px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin-top:10px"></div></div>
</div>`,
  after(el){
    renderPeers();later(()=>{const bx=$('#peerBox');if(bx){bx.dataset.waited=1;renderPeers()}},CLOUD.ready?3500:1500);
    const card=$('#swipeCard',el),txt=$('#swipeTxt',el);let y0=null,dy=0,pid=null;el.style.touchAction='none';el.style.userSelect='none';el.style.webkitUserSelect='none';
    let armed=false;const move=y=>{if(y0===null)return;const raw=y-y0;const arm=raw<-110;if(arm!==armed){armed=arm;fx('tick')}dy=raw<0?raw:raw*0.25;const p=Math.min(1,Math.max(0,-dy/260));
      card.style.transform=`translateY(${dy}px) rotate(${-6+6*p}deg) scale(${1-p*.15})`;txt.style.opacity=1-p*1.5};
    const end=()=>{if(y0===null)return;y0=null;pid=null;card.style.transition='transform .5s cubic-bezier(.34,1.4,.64,1)';
      if(dy<-110){doSend(card)}else{card.style.transform='rotate(-6deg)';txt.style.opacity=1}dy=0};
    el.addEventListener('pointerdown',e=>{if(e.target.closest('.topbar')||e.target.closest('[data-pick]'))return;e.preventDefault();pid=e.pointerId;el.setPointerCapture(pid);y0=e.clientY;card.style.transition='none';card.style.cursor='grabbing'});
    el.addEventListener('pointermove',e=>{if(e.pointerId===pid)move(e.clientY)});
    el.addEventListener('pointerup',e=>{if(e.pointerId===pid)end()});el.addEventListener('pointercancel',end);
  }};
};
A.autoSend=()=>{const c=$('#swipeCard');if(c)doSend(c)};
function doSend(card){
  if(!SENDTO){SENDTO=nearby()[0]||DEMO_PEER()}
  card.style.transition='transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s';card.style.transform='translateY(-520px) rotate(0) scale(.6)';card.style.opacity=0;
  fx('whoosh');
  later(()=>replace('sending',{id:S.sendCard}),420);
}
/* ===== B-03a Sending ===== */
R.sending=()=>{const peer=(SENDTO||DEMO_PEER()).card;return {cls:'dark',html:`
<div style="position:absolute;inset:0;overflow:hidden">${rings()}</div>
<div class="topbar"><button class="ibtn" data-back>${ic('x')}</button>
<div class="pill" style="position:absolute;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.1);color:#fff;height:30px;padding:0 14px;font-size:12.5px;white-space:nowrap"><i class="d"></i>${esc(peer.name)}님 기기와 연결됨</div><span style="width:44px"></span></div>
<div style="position:relative;text-align:center;margin-top:40px"><div class="av blue" style="width:72px;height:72px;margin:0 auto;font-size:26px;box-shadow:0 0 0 14px rgba(0,100,255,.18);animation:pulse 1.2s infinite">${esc(peer.name[0])}</div>
<div style="font-size:14px;font-weight:700;margin-top:18px">${esc(peer.name)} · ${esc(peer.company)}</div></div>
<div style="position:relative;text-align:center;margin-top:110px"><div style="font-size:26px;font-weight:800">보내는 중…</div><div style="font-size:13px;opacity:.6;margin-top:8px">상대방 기기로 명함을 전달하고 있어요</div>
<div style="width:180px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:26px auto 0;overflow:hidden"><div id="prog" style="height:100%;width:0;background:var(--blue);transition:width 1.8s linear"></div></div></div>
<style>@keyframes pulse{50%{box-shadow:0 0 0 22px rgba(0,100,255,.08)}}</style>`,
  after(){requestAnimationFrame(()=>requestAnimationFrame(()=>{const p=$('#prog');if(p)p.style.width='100%'}));
    const to=SENDTO||DEMO_PEER();const t0=Date.now();
    const job=to.demo?new Promise(r=>setTimeout(()=>r(Math.random()>0.15),1900)):cloudSendCard(to.dev,cardData(S.sendCard));
    job.then(ok=>{const wait=Math.max(0,1900-(Date.now()-t0));setTimeout(()=>{if(hist[hist.length-1].name!=='sending')return;
      if(ok){S.lastSent=S.sendCard;const c=S.myCards.find(x=>x.id===S.sendCard);if(c)c.count++;
        S.activity.unshift({g:'TODAY',av:'교',t:`${to.card.name}님에게 명함을 보냈어요`,s:'교환 · 방금',k:'교환'});
        if(!to.demo&&!S.contacts.some(k=>k.dev===to.dev))S.contacts.unshift({id:'c'+Date.now(),dev:to.dev,...to.card,addr:'-',date:'오늘',full:new Date().toISOString().slice(0,10).replace(/-/g,'.'),when:'오늘',color:avc(to.card.name),fav:false,recent:true});save()}
      replace(ok?'sendOk':'sendFail')},wait)})}}};
R.sendOk=()=>{const peer=(SENDTO||DEMO_PEER()).card;const c=cardData(S.lastSent||S.sendCard);const k=S.contacts.find(x=>x.name===peer.name)||S.contacts[0]||{id:''};return {after(){fx('success')},html:`${topbar({left:'closeHome'})}
${result({title:'명함을 보냈어요',sub:`${esc(peer.name)}님에게 ${c.label}이 전달됐어요.`})}
<div class="pad" style="margin-top:30px"><div class="list"><div class="li" data-go="contactDetail" data-p='${J({id:k.id})}'><div class="av" style="background:var(--soft)">${esc(peer.name[0])}</div><div class="tx"><b>${esc(peer.name)}</b><span>${esc(peer.company)}${peer.dept?' · '+esc(peer.dept):''} ${esc(peer.title||'')}</span></div><span class="meta">방금</span></div></div>
${SENDTO&&SENDTO.demo?'<div class="hint" style="text-align:center;margin-top:12px">데모 상대에게 보냈어요. 다른 기기에서 앱을 열어 두면 실제로 전달돼요.</div>':''}</div>
<div class="bottom"><button class="btn black" data-go="wallet" data-mode="reset">확인</button></div>`}};
R.sendFail=()=>({after(){fx('fail')},html:`${topbar({left:'closeHome'})}
${result({kind:'fail',title:'전달하지 못했어요',sub:'상대방 기기가 가까이 있는지, 인터넷에<br>연결돼 있는지 확인해 주세요.'})}
<div class="bottom"><button class="btn primary" data-go="send" data-mode="replace">다시 보내기</button><button class="btn white" data-go="wallet" data-mode="reset">취소</button></div>`});

/* ===== B-06 Receive ===== */
R.receive=({xid})=>{const it=xid&&(S.inbox||[]).find(x=>x.id===xid);const c=it?it.card:(S.contacts[0]||DEMO_PEER().card);return {after(){fx('receive')},html:`${topbar({left:'close',title:'받은 명함'})}
<div class="scroll pad pb-btn">
  <div class="over" style="margin-top:8px">NEW</div><div class="h1" style="margin-top:2px">명함이 도착했어요</div><div class="sub">${esc(c.name)}님이 방금 명함을 보냈어요.</div>
  <div style="margin-top:18px">${bcard({...c,style:it?(c.style||''):'dark'})}</div>
  <div class="list" style="margin-top:14px"><div class="kv"><b>휴대폰</b><span>${esc(c.phone||'-')}</span></div><div class="kv"><b>이메일</b><span>${esc(c.email||'-')}</span></div><div class="kv"><b>회사</b><span>${esc(c.company)}${c.dept?' · '+esc(c.dept):''}</span></div></div>
</div>
<div class="bottom"><div class="row"><button class="btn white" data-back>나중에</button><button class="btn primary" data-act="saveReceived" data-x="${xid||''}">명함첩에 저장</button></div></div>`}};
A.saveReceived=b=>{fx('saved');const it=b&&b.dataset.x&&(S.inbox||[]).find(x=>x.id===b.dataset.x);let id='kim';
  if(it){const ex=S.contacts.find(k=>k.name===it.card.name&&k.company===it.card.company);
    if(ex){Object.assign(ex,it.card,{when:'오늘',recent:true});id=ex.id}else{id='c'+Date.now();S.contacts.unshift({id,dev:it.fromDev,...it.card,addr:'-',date:'오늘',full:new Date().toISOString().slice(0,10).replace(/-/g,'.'),when:'오늘',color:avc(it.card.name),fav:false,recent:true});S.totalContacts++}
    S.activity.unshift({g:'TODAY',av:'교',t:`${it.card.name}님 명함 받음`,s:'교환 · 방금',k:'교환'})}
  snack('명함첩에 저장했어요');S.notis.forEach(n=>{if(n.to==='receive'&&(!it||(n.p&&n.p.xid===it.id)))n.unread=false});save();replace('contactDetail',{id})};

/* ===== B-07 Contacts ===== */
const chosung=n=>{const c=n.charCodeAt(0)-0xAC00;if(c<0||c>11171)return n[0].toUpperCase();return 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'[Math.floor(c/588)]};
R.contacts=({f='all',q=''})=>({tab:'wallet',html:`${topbar({title:'명함첩'})}
<div class="scroll pad pb-nav">
  <div class="h1" style="margin-top:8px">명함첩</div><div class="sub" style="margin-top:4px">총 ${S.totalContacts}명</div>
  <div class="inp" style="margin-top:16px;border-radius:20px">${ic('search','style="width:20px;height:20px;color:var(--g2)"')}<input id="cq" placeholder="이름, 회사로 검색" value="${esc(q)}"></div>
  <div class="chips" style="margin-top:12px">${[['all','전체'],['recent','최근 교환'],['fav','즐겨찾기']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="cFilter" data-k="${k}">${l}</button>`).join('')}</div>
  <div id="clist"></div>
</div>`,after(el){const draw=()=>{const qq=$('#cq').value.trim();let L=S.contacts.filter(c=>(f==='all'||(f==='fav'&&c.fav)||(f==='recent'&&c.recent))&&(!qq||(c.name+c.company+c.dept).includes(qq)));
  L.sort((a,b)=>a.name.localeCompare(b.name,'ko'));const g={};L.forEach(c=>{(g[chosung(c.name)]=g[chosung(c.name)]||[]).push(c)});
  $('#clist').innerHTML=L.length?Object.entries(g).map(([k,arr])=>`<div style="color:var(--blue);font-size:13px;font-weight:700;margin:20px 4px 8px">${k}</div><div class="list">${arr.map(c=>`<div class="li" data-go="contactDetail" data-p='{"id":"${c.id}"}'><div class="av">${c.name[0]}</div><div class="tx"><b>${c.name}${c.fav?' <span style="color:#F5A524">★</span>':''}</b><span>${c.company}${c.dept?' · '+c.dept:''} ${c.title}</span></div><span class="meta">${c.date}</span>${ic('right','class="chev"')}</div>`).join('')}</div>`).join(''):(S.contacts.length?'<div class="empty">검색 결과가 없어요</div>':'<div class="empty">아직 받은 명함이 없어요.<br>명함 보내기로 주고받아 보세요.</div>');bind($('#clist'))};
  $('#cq').oninput=draw;draw()}});
A.cFilter=b=>replace('contacts',{f:b.dataset.k,q:$('#cq').value},'none');

/* ===== B-08 Contact detail ===== */
R.contactDetail=({id})=>{const c=S.contacts.find(x=>x.id===id)||S.contacts[0];if(!c)return R.contacts({});return {html:`${topbar({title:'명함 상세'})}

    <button class="chip" style="flex:1;height:44px;border-radius:22px;background:var(--soft);color:var(--blue)" data-act="shareContact" data-id="${c.id}">공유</button></div>
  <div class="list" style="margin-top:14px"><div class="kv"><b>휴대폰</b><span>${c.phone}</span></div><div class="kv"><b>이메일</b><span>${c.email}</span></div><div class="kv"><b>부서 / 직위</b><span>${c.dept||'-'} / ${c.title}</span></div><div class="kv"><b>주소</b><span>${c.addr}</span></div><div class="kv"><b>교환일</b><span>${c.full}</span></div></div>
</div>

A.shareContact=b=>shareSheet(S.contacts.find(x=>x.id===b.dataset.id),false);
A.toggleFav=b=>{const c=S.contacts.find(x=>x.id===b.dataset.id);c.fav=!c.fav;fx(c.fav?'saved':'tick');save();snack(c.fav?'즐겨찾기에 추가했어요':'즐겨찾기에서 뺐어요');replace('contactDetail',{id:c.id},'none')};

/* ===== B-09 My cards ===== */
R.myCards=()=>({tab:'wallet',html:`${topbar({title:'내 명함 관리'})}
<div class="scroll pad pb-nav">
  <div class="h1" style="margin-top:8px">내 명함 관리</div><div class="sub">최대 5개까지 등록할 수 있어요 · ${S.myCards.length} / 5</div>
  <div class="list" style="margin-top:18px">${S.myCards.map(c0=>{const c=cardData(c0.id);return `<div class="li" data-go="cardManage" data-p='{"id":"${c.id}"}'><div class="av" style="background:var(--soft)">${S.user.name[0]}</div><div class="tx"><b>${c.label}</b><span>${c.company}${(c.type==='basic'?c.title:c.dept||c.title)&&(c.type==='basic'?c.title:c.dept||c.title)!=='-'?' · '+(c.type==='basic'?c.title:c.dept||c.title):''}</span></div><span class="meta">${c.type==='basic'?'기본':'편집'}</span>${ic('right','class="chev"')}</div>`}).join('')}</div>
  ${S.myCards.filter(c=>c.type!=='basic').map(c=>`<div style="text-align:right;margin-top:12px"><button style="color:var(--red);font-size:13px;font-weight:700" data-act="askDelete" data-id="${c.id}">${c.label} 삭제</button></div>`).join('')}
  <button class="btn ghost" style="margin-top:20px" data-act="addCard" ${S.myCards.length>=5?'disabled':''}>+ 명함 추가하기</button>
  <div class="hint" style="margin-top:14px">기본 명함은 삭제할 수 없고, 프로필을 수정하면 자동으로 반영돼요.</div>
</div>`});
A.addCard=()=>go('cardEdit',{mode:'add'});
A.askDelete=b=>{const c=S.myCards.find(x=>x.id===b.dataset.id);
  sheet(`<div style="text-align:center"><div class="h2">${c.label}을 삭제할까요?</div><div class="sub">삭제한 명함은 복구할 수 없어요.<br>이미 전달한 명함 기록은 그대로 남아요.</div></div>
  <button class="btn red" style="margin-top:22px" data-act="doDelete" data-id="${c.id}">삭제</button><button class="btn outline" style="margin-top:10px" data-act="closeSheet">취소</button>`)};
A.doDelete=b=>{fx('remove');S.myCards=S.myCards.filter(c=>c.id!==b.dataset.id);if(S.sendCard===b.dataset.id)S.sendCard='basic';save();closeSheet();snack('명함을 삭제했어요');
  const cur=hist[hist.length-1].name;if(cur==='cardManage'){back()}else replace('myCards',{},'none')};

</div>
<div class="bottom"><button class="btn primary" data-go="${basic?'profile':'cardEdit'}" data-p='${J({mode:'edit',id})}'>${basic?'프로필에서 수정하기':'명함 수정하기'}</button></div>`}};
A.shareCard=b=>shareSheet(cardData(b.dataset.id),true);
A.setSend=b=>{S.sendCard=b.dataset.id;save();go('send',{id:b.dataset.id})};

/* ===== B-10 / B-10a Card add / edit ===== */
R.cardEdit=({mode='add',id})=>{
  const src=mode==='edit'?cardData(id):{label:'',name:S.user.name,en:S.user.en,title:'팀장',company:S.user.company,dept:'영업팀',phone:S.user.phone,email:'sales@jdsol.co.kr',style:''};
  window._draft={...src};
  const f=(k,l,ph='')=>`<div class="field"><label>${l}</label><div class="inp"><input data-k="${k}" value="${esc(src[k]||'')}" placeholder="${ph}"></div></div>`;
  return {html:`${topbar({title:mode==='edit'?'명함 수정':'명함 추가'})}
<div class="scroll pad pb-btn">

/* decide request → reflects into visitor app if it came from the app */
function decideRequest(id,approve,reason){
  const r=AD().requests.find(x=>x.id===id);if(!r||r.status!=='대기')return;
  r.status=approve?'승인':'반려';if(!approve)r.reason=reason||'담당자 사정으로 방문이 어려워요.';
  audit(approve?'방문 예약 승인':'방문 예약 반려',`${r.name} · ${r.dates.replace(/ /g,'')}`);
  if(approve)AD().keys.unshift({id:'k'+Date.now(),name:r.name,co:r.company,period:r.days>1?r.dates:r.dates+' (당일)',st:'발급 예정',exp:'18:00'});
  if(r.fromApp)applyVisitDecision(r.fromApp,approve,r.reason);
  if(r.remote||r.app)cloudUpdate('requests/'+r.id,{status:r.status,reason:r.reason||'',decidedAt:Date.now(),decidedBy:AD().me.name});
  save();
}
function applyVisitDecision(vid,approve,reason){
  const v=S.visits.find(x=>x.id===vid);if(!v||v.status!=='승인 대기')return;
  if(approve){v.status='예정';v.active=true;S.visits.forEach(x=>{if(x!==v)x.active=false});S.visitState='active';
    S.notis.unshift({g:'TODAY',av:'예',t:'예약이 승인되었어요',s:'사운드 키가 발급됐어요',w:'방금',to:'approved',p:{id:v.id},unread:true})}
  else{v.status='반려';v.reason=reason||'해당 일자에 담당자가 부재 중이에요. 다른 날짜로 다시 신청해 주세요.';S.visitState=S.visits.some(x=>x.status==='예정')?'active':'none';
    S.notis.unshift({g:'TODAY',av:'예',t:'예약이 반려되었어요',s:'반려 사유를 확인해 주세요',w:'방금',to:'rejected',p:{id:v.id},unread:true})}

function holdToOpen(btn,done){const fill=document.createElement('i');fill.style.cssText='position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.28);pointer-events:none';btn.appendChild(fill);let t0=0,raf=0,ok=false;
  const step=()=>{const p=Math.min(1,(performance.now()-t0)/1200);fill.style.width=p*100+'%';if(p>=1){ok=true;fx('success');done();return}raf=requestAnimationFrame(step)};

  <div style="display:flex;gap:10px;background:var(--soft);color:var(--blue);border-radius:18px;padding:14px;margin-top:14px;font-size:12.5px;font-weight:700;line-height:1.5">${ic('key','style="width:18px;height:18px;flex-shrink:0"')}<span>장기 방문자의 사운드 키는 매일 09:00에 자동 갱신되고 18:00에 만료돼요.</span></div>
</div>`}};

/* AM-11 Visitor */
R['am-visitor']=({name='박서준'})=>{const r=AD().requests.find(x=>x.name===name)||{name,en:'',title:'',company:(AD().todayVisits.find(v=>v.name===name)||{sub:''}).sub.split(' · ')[0],dept:'',phone:'010-0000-0000',email:'-'};
  const pc=name==='박서준';return {html:`${amTop({title:'방문자'})}
<div class="scroll pad pb-btn">
  <div style="margin-top:6px">${bcard({name:r.name,en:r.en||'',title:r.title,company:r.company,dept:r.dept,phone:r.phone,email:r.email})}</div>
  <div style="display:flex;gap:8px;margin-top:12px">${[['누적 방문',pc?'6회':'1회'],['최근 방문','오늘'],['출입 실패',AD().logs.filter(l=>l.name===name&&l.res==='실패').length+'건']].map(([a,b])=>`<div class="card" style="flex:1;padding:12px 14px;border-radius:18px"><div style="font-size:11.5px;color:var(--g2)">${a}</div><b style="font-size:18px">${b}</b></div>`).join('')}</div>
  <div class="sec-h"><b>방문 이력</b><a>전체</a></div>
  <div class="list">${(pc?[['10.01 – 10.03','협력 미팅 · 3일','진행 중'],['08.21','제품 리뷰 · 당일','완료'],['07.09','계약 미팅 · 당일','완료']]:[[r.dates||'10.02',(r.purpose||'미팅')+' · '+((r.days||1)>1?r.days+'일':'당일'),'진행 중']]).map(([a,b,c])=>`<div class="kv"><div><b style="font-size:15px">${a}</b><div style="font-size:12px;color:var(--g2);margin-top:2px">${b}</div></div>${mbd(c)}</div>`).join('')}</div>
  <div class="sec-h"><b>관리자 메모</b></div><div class="card" style="padding:16px;font-size:14px;line-height:1.6">${esc(AD().memo[name]||'메모가 없어요')}</div>
</div>
<div class="bottom"><div class="row"><button class="btn white" data-act="amMsg">메시지</button><button class="btn primary" data-go="am-invite">다시 초대</button></div></div>`}};
A.amMsg=()=>snack('방문자에게 안내 메시지를 보냈어요 (데모)');

/* AM-12 Logs */
R['am-logs']=({f='전체'})=>{const A=AD();const fails=A.logs.filter(l=>l.day==='today'&&l.res==='실패').length;
  const flt=l=>f==='전체'||l.res===f||(f==='본사 3F'&&l.gate.startsWith('3F'))||(f==='본사 5F'&&l.gate.startsWith('5F'));
  const grp=[['오늘 · 10월 2일','today'],['어제 · 10월 1일','yesterday']];
  return {tab:'am-logs',html:`${amTop({title:'출입 기록'})}
<div class="scroll pad pb-nav">
  <div class="over" style="margin-top:6px">ACCESS LOG</div><div class="h1" style="margin-top:2px">출입 기록</div><div class="sub">오늘 ${36+A.logs.filter(l=>l.day==='today').length}건 · 실패 ${fails}건</div>
  <div class="chips" style="margin:16px 0 4px">${['전체','성공',`실패 ${fails}`,'본사 3F','본사 5F'].map(k=>`<button class="chip ${f===k.replace(/ \d+$/,'')?'on':''}" data-go="am-logs" data-mode="replace" data-p='${J({f:k.replace(/ \d+$/,'')})}'>${k}</button>`).join('')}</div>
  ${grp.map(([t,d])=>{const L=A.logs.filter(l=>l.day===d&&flt(l));return L.length?`<div class="label-sm" style="letter-spacing:0;font-size:12px">${t}</div><div class="list">${L.map(l=>`<div class="li" ${l.res==='실패'?`data-go="am-logfail" data-p='${J({i:A.logs.indexOf(l)})}'`:''}><span style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:${l.res==='실패'?'#FDE7E7':'var(--canvas)'};color:${l.res==='실패'?'var(--red)':''}">${ic('door','style="width:18px;height:18px"')}</span><div class="tx"><b>${l.name} <span style="display:inline;font-size:12px;color:var(--g1);font-weight:500">${l.t.slice(0,5)}</span></b><span>${l.gate} · ${l.res==='실패'?l.note:l.how}</span></div>${mbd(l.res)}</div>`).join('')}</div>`:''}).join('')}
</div>`}};
/* AM-13 Fail detail */
R['am-logfail']=({i=1})=>{const l=AD().logs[i]||AD().logs[1];return {html:`${amTop({title:'출입 실패'})}
<div class="scroll pad pb-btn">
  <div class="card" style="padding:16px;margin-top:6px"><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:14px;background:#FDE7E7;color:var(--red);display:grid;place-items:center">${ic('door','style="width:20px;height:20px"')}</span><div style="flex:1"><b style="font-size:16px">${l.gate} 출입 실패</b><div style="font-size:12px;color:var(--g2)">${l.t.slice(0,5)} · 방금 전</div></div>${mbd('실패')}</div>
   <div style="background:var(--canvas);border-radius:14px;padding:12px 14px;margin-top:12px"><b style="font-size:13.5px">원인 · ${l.cause||l.note}</b><div style="font-size:12.5px;color:var(--g2);margin-top:4px;line-height:1.5">${l.causeDetail||''}</div></div></div>
  <div class="sec-h"><b>방문자 정보</b></div><div class="list">${[['방문자',`${l.name}${l.co?' · '+l.co:''}`],['연락처',l.phone||'—'],['최근 예약',(l.lastRes||'—')+' ›'],['담당자',l.host||'박지훈']].map(([a,b])=>`<div class="kv"><b>${a}</b><span>${b}</span></div>`).join('')}</div>
  <div class="sec-h"><b>단말기</b></div><div class="list"><div class="kv" data-go="am-terminals"><b>게이트</b><span>본사 ${l.gate} ›</span></div><div class="kv"><b>상태</b><span>정상 · 신호 강함</span></div></div>
</div>
<div class="bottom"><div class="row"><button class="btn white" data-act="amGuide">안내 보내기</button><button class="btn primary" data-act="amRemote" data-i="${i}">원격 문 열기</button></div></div>`}};

/* AM-14 Remote open sheet */
A.amRemote=b=>{const l=AD().logs[+b.dataset.i];const s=sheet(`<div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--blue);display:grid;place-items:center">${ic('door','style="width:20px;height:20px"')}</span><div><div class="h2" style="font-size:18px">${l.gate} 원격 열기</div><div style="font-size:12px;color:var(--g2)">${l.name}${l.co?' · '+l.co:''} · ${l.t.slice(0,5)} 출입 실패</div></div></div>
  <div style="font-size:13px;font-weight:700;margin:16px 0 8px">여는 이유</div><div class="chips">${['방문자 도착 확인','키 재발급 전 임시','택배 · 배송'].map((k,i)=>`<button class="chip ${i===0?'on':''}" style="${i?'background:transparent':''}" data-rr>${k}</button>`).join('')}</div>
  <div style="background:#FFF6E5;color:#9A6400;border-radius:14px;padding:12px 14px;font-size:12.5px;font-weight:700;margin-top:14px;line-height:1.5">문은 5초간 열려요. 원격 열기는 관리자 이름(${AD().me.name})으로 출입 기록에 남아요.</div>
  <button class="btn primary" id="amHold" style="margin-top:16px;position:relative;overflow:hidden">${ic('door')}<span>길게 눌러 문 열기</span></button><button class="btn outline" style="margin-top:10px" data-act="closeSheet">취소</button>`);
  $$('[data-rr]',s).forEach(c=>c.onclick=()=>$$('[data-rr]',s).forEach(x=>{x.classList.toggle('on',x===c);x.style.background=x===c?'':'transparent'}));
  holdToOpen($('#amHold',s),()=>{doRemoteOpen(l);closeSheet();setTimeout(()=>reset('am-logs'),400)})};

R['am-terminals']=()=>{const A=AD();const off=A.terminals.filter(t=>t.st==='오프라인');return {html:`${amTop({title:'단말기'})}
<div class="scroll pad" style="padding-bottom:40px">
  <div class="over" style="margin-top:6px">TERMINALS</div><div class="h1" style="margin-top:2px">단말기 상태</div><div class="sub">본사 ${A.terminals.length+2}대 · 마지막 점검 09:00</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><div class="card" style="padding:16px"><div style="font-size:13px;color:var(--g2)">정상</div><div style="font-size:30px;font-weight:800">${A.terminals.length+2-off.length}<small style="font-size:12px;color:var(--g2)"> 대</small></div><div style="font-size:11.5px;color:var(--g2)">가동률 99.8%</div></div>
   <div class="card" style="padding:16px"><div style="font-size:13px;color:var(--g2)">오프라인</div><div style="font-size:30px;font-weight:800">${off.length}<small style="font-size:12px;color:var(--g2)"> 대</small></div><div style="font-size:11.5px;color:var(--red);font-weight:700">${off.map(t=>t.name).join(', ')||'—'}</div></div></div>
  ${A.terminals.map(t=>`<div class="card" style="padding:16px;margin-top:12px"><div style="display:flex;align-items:center;gap:12px"><span style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:${t.st==='오프라인'?'#FDE7E7':'var(--canvas)'};color:${t.st==='오프라인'?'var(--red)':''}">${ic('device','style="width:18px;height:18px"')}</span><div style="flex:1"><b style="font-size:15px">본사 ${t.name}</b><div style="font-size:12px;color:var(--g2)">${t.st==='오프라인'?t.last+' 마지막 응답':t.st==='업데이트'?'펌웨어 2.4.1 업데이트 가능':t.sig+' · 오늘 '+t.cnt+'회 출입'}</div></div>${mbd(t.st)}</div>
   ${t.st!=='정상'?`<div style="display:flex;gap:8px;margin-top:12px">${t.st==='오프라인'?`<button class="btn outline" style="height:44px;font-size:14px" data-act="amTerm" data-id="${t.id}" data-k="restart">원격 재시작</button><button class="btn black" style="height:44px;font-size:14px" data-act="amTerm" data-id="${t.id}" data-k="check">점검 요청</button>`:`<button class="btn ghost" style="height:44px;font-size:14px" data-act="amTerm" data-id="${t.id}" data-k="fw">업데이트</button>`}</div>`:''}</div>`).join('')}
</div>`}};
A.amTerm=b=>{const t=AD().terminals.find(x=>x.id===b.dataset.id);const k=b.dataset.k;
  if(k==='check'){audit('단말기 점검 요청',t.name);save();snack('시설팀에 점검을 요청했어요');return}
  b.textContent=k==='fw'?'업데이트 중…':'재시작 중…';b.disabled=true;
  setTimeout(()=>{t.st='정상';t.last='방금';t.fw='2.4.1';t.sig='신호 강함';audit(k==='fw'?'펌웨어 업데이트':'단말기 원격 재시작',t.name);save();fx('success');snack(`${t.name} 정상으로 돌아왔어요`);replace('am-terminals',{},'none')},1800)};

   <div style="display:flex;gap:8px"><button class="btn outline" style="height:46px;font-size:15px" data-act="verifyAct" data-id="${v.id}" data-k="no">반려</button><button class="btn primary" style="height:46px;font-size:15px" data-act="verifyAct" data-id="${v.id}" data-k="ok">승인</button></div></div>`).join('')||'<div class="card empty" style="margin-top:16px">대기 중인 요청이 없어요</div>'}

  <div class="sec-h" style="margin-top:22px"><b>관리</b></div><div class="list">${row('단말기 상태',off?off+'대 오프라인':'정상','am-terminals')}${row('소속 인증 요청',A.verifyReqs.length+'건','am-verify')}${row('오늘 방문','18명','am-today')}${row('방문자 초대','','am-invite')}${row('비상 모드',A.emergency?'실행 중':'전체 개방 · 잠금','am-emergency')}</div>

  <div class="list" style="margin-top:14px"><div class="li menu" data-act="amLogout"><div class="tx"><b style="color:var(--red)">로그아웃</b></div></div></div>
</div>`}};

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function cloudInit(){
  if(window.claude&&typeof window.claude.use==='function'){
    try{CLOUD.db=await window.claude.use('db')}catch(e){CLOUD.db=null}
    try{CLOUD.room=await window.claude.use('room')}catch(e){CLOUD.room=null}
    CLOUD.mode='artifact';
  }else if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){
    try{const V='10.12.2';await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
      await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`),loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`)]);
      firebase.initializeApp(window.FIREBASE_CONFIG);CLOUD.db=firebase.firestore();CLOUD.auth=firebase.auth();CLOUD.mode='firebase';
      // heartbeat so other phones see this one as "nearby" (own backend only)
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')touchDevice()});setInterval(()=>{if(document.visibilityState==='visible')touchDevice()},90000);
    }catch(e){CLOUD.db=null}
  }else return;
  if(CLOUD.db){CLOUD.ready=true;if(CLOUD.mode==='firebase'){authBoot();return}subscribeAll();publishDevice()}
  if(CLOUD.room){try{CLOUD.room.onPeers(ch=>{CLOUD.peers=ch.peers.filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.dev&&p.presence.dev!==ME());onPeersChange()},()=>{});setPresence()}catch(e){}}
  cloudBadge();
}
let lastPres='';function setPresence(){if(!CLOUD.room)return;if(adminView()){if(lastPres!=='admin'){lastPres='admin';CLOUD.room.presence({dev:ME(),app:'admin',card:null}).catch(()=>{})}return}const c=cardPayload(cardData(S.sendCard||'basic'));const sig=JSON.stringify(c);if(sig===lastPres)return;lastPres=sig;CLOUD.room.presence({dev:ME(),app:'app',card:c}).catch(()=>{})}
let saveT=null;window.__onSave=()=>{if(!CLOUD.ready&&!CLOUD.room)return;clearTimeout(saveT);saveT=setTimeout(()=>{setPresence();publishDevice()},400)};
let lastDevSig='';

async function publishDevice(){if(!CLOUD.db||adminView()||(CLOUD.mode==='firebase'&&!CLOUD.uid))return;const cc=cardData(S.sendCard||'basic');const c={name:cc.name||'',company:cc.company||'',dept:cc.dept||'',title:cc.title||''};if(!c.name)return;const sig=JSON.stringify(c);if(sig===lastDevSig)return;lastDevSig=sig;

/* nearby list: people who have the app open right now (room), else recent devices (db) */
function nearby(){
  const live=CLOUD.peers.filter(p=>p.presence.app!=='admin'&&p.presence.card).map(p=>({dev:p.presence.dev,card:p.presence.card||{},live:true}));
  const seen=new Set(live.map(x=>x.dev));
  const recent=CLOUD.devices.filter(d=>d.dev!==ME()&&!seen.has(d.dev)&&Date.now()-(d.openedAt||0)<30*60*1000).map(d=>({dev:d.dev,card:d.card||{},live:Date.now()-(d.openedAt||0)<3*60*1000})).sort((a,b)=>b.live-a.live);
  const uniq=[];const names=new Set();for(const x of [...live,...recent]){const k=x.dev;if(!names.has(k)){names.add(k);uniq.push(x)}}
  return uniq.filter(x=>x.card&&x.card.name);
}
function onPeersChange(){if(typeof renderPeers==='function')renderPeers()}

/* subscriptions */
function unsubscribeAll(){(CLOUD.unsubs||[]).forEach(u=>{try{u()}catch(e){}});CLOUD.unsubs=[];CLOUD.first={}}
function subscribeAll(){unsubscribeAll();const db=CLOUD.db;const err=e=>{console.warn('sync',e&&e.code)};const U=f=>CLOUD.unsubs.push(f);
  const FB=CLOUD.mode==='firebase',ADMIN=!FB||CLOUD.isAdmin;
  const reqQ=ADMIN?db.collection('requests').orderBy('at','desc').limit(200):db.collection('requests').where('uid','==',ME());
  U(reqQ.onSnapshot(snap=>{const first=!CLOUD.first.req;CLOUD.first.req=true;let newPend=null;
    snap.docChanges().forEach(ch=>{if(ch.type==='removed')return;const d={...ch.doc.data(),id:ch.doc.id,remote:true};
      const ex=AD().requests.find(r=>r.id===d.id);if(ex)Object.assign(ex,d);else{AD().requests.unshift(d);if(!first&&d.status==='대기'&&d.dev!==ME())newPend=d}
      if(d.dev===ME()&&d.status!=='대기')applyVisitDecision(d.visitId,d.status==='승인',d.reason)});
    save();if(newPend&&adminView()){AD().notis.unshift({g:'오늘',icon:'list',tone:'blue',t:'새 방문 예약 요청',s:`${newPend.name} · ${newPend.company} · ${newPend.dates}`,w:'방금',k:'승인',to:'request',p:newPend.id,unread:true});adminToast(`새 방문 예약 요청 · ${newPend.name}`,`${newPend.dates} · ${newPend.time}`,newPend.id)}
    refreshAdmin();refreshApp()},err));
  if(ADMIN){U(db.collection('logs').orderBy('at','desc').limit(100).onSnapshot(snap=>{const first=!CLOUD.first.logs;CLOUD.first.logs=true;let fail=null;
    snap.docChanges().forEach(ch=>{if(ch.type!=='added')return;const d={...ch.doc.data(),id:ch.doc.id};if(AD().logs.some(l=>l.id===d.id))return;AD().logs.unshift(d);if(!first&&d.res==='실패'&&d.dev!==ME())fail=d});
    if(fail){AD().notis.unshift({g:'오늘',icon:'door',tone:'red',t:`${fail.gate} 출입 실패`,s:`${fail.name} · ${fail.note}`,w:'방금',k:'출입',to:'logFail',p:AD().logs.indexOf(fail),unread:true});if(adminView())adminToast(`${fail.gate} 출입 실패 · ${fail.name}`,fail.note)}
    save();refreshAdmin()},err));
  U(db.collection('verify').onSnapshot(snap=>{snap.docChanges().forEach(ch=>{const id=ch.doc.id;
      if(ch.type==='removed'){AD().verifyReqs=AD().verifyReqs.filter(v=>v.id!==id);return}
      const d={...ch.doc.data(),id,remote:true};const ex=AD().verifyReqs.find(v=>v.id===id);if(ex)Object.assign(ex,d);else if(!d.done)AD().verifyReqs.unshift(d)});save();refreshAdmin()},err));
  if(FB)U(db.collection('users').limit(500).onSnapshot(snap=>{syncMembers(snap.docs.map(d=>({uid:d.id,...d.data()})));refreshAdmin()},err))}
  U(db.collection('notices').onSnapshot(snap=>{const first=!CLOUD.first.not;CLOUD.first.not=true;
    snap.docChanges().forEach(ch=>{const d={...ch.doc.data(),id:ch.doc.id,adminNew:true};const ex=AD().notices.find(n=>n.id===d.id);
      if(ex)Object.assign(ex,d);else{AD().notices.unshift(d);if(!first&&d.st==='게시 중'&&String(d.target).includes('방문자')&&!S.notis.some(n=>n.nid===d.id))S.notis.unshift({g:'TODAY',av:'공',t:d.title,s:'공지사항',w:'방금',to:'notice',unread:true,nid:d.id})}});
    save();refreshApp()},err));
  U(db.collection('exchanges').where('to','==',ME()).onSnapshot(snap=>{snap.docChanges().forEach(ch=>{if(ch.type==='removed')return;const d=ch.doc.data();if(d.seen)return;
      S.inbox=S.inbox||[];if(S.inbox.some(x=>x.id===ch.doc.id))return;
      S.inbox.unshift({id:ch.doc.id,card:d.card,fromDev:d.from,at:d.at});
      S.notis.unshift({g:'TODAY',av:'교',t:`${d.card.name}님이 명함을 보냈어요`,s:'받은 명함을 확인해 보세요',w:'방금',to:'receive',p:{xid:ch.doc.id},unread:true});
      save();CLOUD.db.doc('exchanges/'+ch.doc.id).update({seen:true}).catch(()=>{});
      if(!adminView())toast({av:d.card.name[0],title:`${d.card.name}님이 명함을 보냈어요`,sub:`${d.card.company}${d.card.dept?' · '+d.card.dept:''} · 탭해서 확인`,to:'receive',p:{xid:ch.doc.id},sfx:'receive'});
      refreshApp()})},err));
  U(db.collection('devices').orderBy('openedAt','desc').limit(30).onSnapshot(snap=>{CLOUD.devices=snap.docs.map(d=>d.data());onPeersChange()},err));
}

const _dup=A.dupCheck;
A.dupCheck=async b=>{if(!FBM())return _dup(b);if(noSrv())return;const v=$('#sid input').value.trim();
  if(!/^[A-Za-z0-9]{8,16}$/.test(v)){setHint('sid',false,'영문, 숫자 8~16자로 입력해 주세요');return}
  busy(b,true,'확인 중');try{const s=await CLOUD.db.doc('usernames/'+v.toLowerCase()).get();busy(b,false);
    if(s.exists){setHint('sid',false,'이미 사용 중인 아이디예요');return}
    window._dup=true;b.textContent='확인 완료';setHint('sid',true,'사용할 수 있는 아이디예요');window._chk()}
  catch(e){busy(b,false);setHint('sid',false,authMsg(e))}};
const _s1=A.signup1Next;A.signup1Next=()=>{window._pw=$('#spw input').value;if(FBM()){S.user={...DEF.user,name:'',en:'',company:'',dept:'',title:'',phone:'',email:'',addr:''}}S.user.id=$('#sid input').value.trim();go('signup2')};
A.createAccount=async b=>{if(!FBM()){reset('signupDone');return}if(noSrv())return;
  const u=S.user;if(!u.name){snack('이름을 입력해 주세요');return}if(!/.+@.+\..+/.test(u.email||'')){snack('2단계에서 이메일을 정확히 입력해 주세요');return}
  if(!window._pw){snack('비밀번호를 다시 입력해 주세요');reset('signup1');return}
  busy(b,true,'가입 중…');
  try{const w=acctReady();const cred=await CLOUD.auth.createUserWithEmailAndPassword(u.email,window._pw);const uid=cred.user.uid;window._pw=null;
    await CLOUD.db.doc('usernames/'+u.id.toLowerCase()).set({uid,email:u.email,createdAt:Date.now()});
    await w;S.user={...S.user,...u};
    await CLOUD.db.doc('users/'+uid).set({id:u.id,role:'구성원',createdAt:Date.now(),profile:{name:u.name,email:u.email,company:u.company||'',dept:u.dept||'',title:u.title||'',phone:u.phone||''},app:appSubset(),dev:CLOUD.dev,updatedAt:Date.now()},{merge:true});
    try{localStorage.setItem('jdtag-lastid',u.id)}catch(e){}
    reset('signupDone')}
  catch(e){busy(b,false);snack(authMsg(e))}};

A.fbResetPw=async b=>{const v=$('#fx1').value.trim(),er=$('#fxe');er.style.display='none';if(!v){er.textContent='아이디 또는 이메일을 입력해 주세요';er.style.display='block';return}

${result({title:'메일을 보냈어요',sub:`${esc(email.replace(/^(.{2}).*(@.*)$/,'$1***$2'))}로 비밀번호 재설정 링크를 보냈어요.<br>메일의 링크에서 새 비밀번호를 정해 주세요.`})}
<div class="bottom"><button class="btn black" data-go="login" data-mode="reset">로그인 하기</button></div>`});

/* ---- admin login (PC + mobile): must be a signed-in account listed in admins/{uid} ---- */
async function adminSignIn(email,pw,btn,onOk,onMsg){
  if(!FBM()){onOk();return}if(!CLOUD.auth){onMsg('서버에 연결하지 못했어요');return}
  busy(btn,true,'로그인 중…');
  try{const em=await idToEmail(email);if(!em)throw {code:'auth/invalid-credential'};
    if(!CLOUD.uid||CLOUD.email!==em){const w=acctReady();await CLOUD.auth.signInWithEmailAndPassword(em,pw);await w}
    busy(btn,false);
    if(CLOUD.isAdmin){AD().loggedIn=true;save();fx('success');onOk()}
    else onMsg(`이 계정에는 관리자 권한이 없어요.<br><br>Firebase 콘솔 → Firestore → <b>admins</b> 컬렉션에 문서 ID를 아래 UID로 하는 문서를 만들면 관리자가 돼요.<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--canvas);font-family:monospace;font-size:12.5px;word-break:break-all;user-select:all">${CLOUD.uid}</div>`)}
  catch(e){busy(btn,false);onMsg(authMsg(e))}}
const _caLogin=CA.login;
CA.login=b=>{if(!FBM())return _caLogin(b);window.LOGIN_MSG='';adminSignIn($('#lc2').value,$('#lc3').value,b,()=>{window.LOGIN_MSG='';cgo('dashboard')},m=>{window.LOGIN_MSG=m;renderConsole()})};
const _caLogout=CA.logout;CA.logout=async()=>{if(FBM())await CLOUD.auth.signOut();_caLogout()};
const _amLogin=A.amLogin;
A.amLogin=b=>{if(!FBM())return _amLogin(b);adminSignIn($('#amE').value,$('#amP').value,b,()=>reset('am-home'),m=>sheet(`<div class="h2" style="font-size:18px">로그인하지 못했어요</div><div class="sub" style="margin-top:8px">${m}</div><button class="btn black" style="margin-top:18px" data-act="closeSheet">확인</button>`))};
const _amLogout=A.amLogout;A.amLogout=async()=>{if(FBM())await CLOUD.auth.signOut();_amLogout()};

/* ===== Native shell (Capacitor iOS/Android) + installed-PWA detection ===== */
const NATIVE=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==='function'&&window.Capacitor.isNativePlatform());
const NP=NATIVE?(window.Capacitor.Plugins||{}):{};
(function(){const html=document.documentElement;
  const standalone=NATIVE||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone)html.classList.add('standalone');
  if(NATIVE){html.classList.add('native',window.Capacitor.getPlatform())}
})();
if(NATIVE){
  // native haptics instead of navigator.vibrate (works on iPhone too)
  const HMAP={tap:['impact','LIGHT'],tick:['selection'],toggle:['impact','LIGHT'],whoosh:['impact','MEDIUM'],found:['impact','LIGHT'],success:['notification','SUCCESS'],fail:['notification','ERROR'],
    receive:['notification','SUCCESS'],notify:['notification','WARNING'],saved:['impact','LIGHT'],remove:['impact','HEAVY'],entry:['notification','SUCCESS']};
  const _fx=fx;
  fx=function(name,opt={}){_fx(name,{...opt,haptic:false});if(opt.haptic===false||!S.settings.haptic||!NP.Haptics)return;const h=HMAP[name];if(!h)return;
    try{if(h[0]==='impact')NP.Haptics.impact({style:h[1]});else if(h[0]==='notification')NP.Haptics.notification({type:h[1]});else NP.Haptics.selectionChanged&&NP.Haptics.selectionChanged()}catch(e){}};
  // status bar colour follows the screen (dark screens → light icons)
  let sbDark=null;const setBar=dark=>{if(!NP.StatusBar||dark===sbDark)return;sbDark=dark;try{NP.StatusBar.setStyle({style:dark?'DARK':'LIGHT'});
      if(window.Capacitor.getPlatform()==='android')NP.StatusBar.setBackgroundColor({color:dark?'#0E0F12':'#F2F3F5'})}catch(e){}};
  const _render=render;render=function(anim){_render(anim);const sc=document.querySelector('#phone .screen:last-of-type');setBar(!!(sc&&sc.classList.contains('dark'))||hist[hist.length-1]?.name==='login')};
  // Android hardware back button
  if(NP.App)NP.App.addListener('backButton',()=>{if(document.querySelector('.sheet')){closeSheet();return}if(hist.length>1){back();return}
    const cur=hist[hist.length-1]?.name;if(cur&&!['home','login','am-home','am-login'].includes(cur)){reset(cur.startsWith('am-')?'am-home':(S.loggedIn?'home':'login'));return}NP.App.exitApp()});
  // hide the native splash once the web splash is on screen
  setTimeout(()=>{try{NP.SplashScreen&&NP.SplashScreen.hide({fadeOutDuration:250})}catch(e){}},150);
  if(NP.Keyboard&&NP.Keyboard.setAccessoryBarVisible)try{NP.Keyboard.setAccessoryBarVisible({isVisible:false})}catch(e){}
}

/* ===== Boot ===== */
(function boot(){
  let h=(location.hash||'').slice(1);if(h==='app-settings')h='settings';
  // desktop shortcut to the admin console (visible only in app mode on wide screens)
  const FBCFG=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey)&&!(window.claude&&window.claude.use);
  if(FBCFG){CLOUD.mode='firebase';S.loggedIn=false;AD().loggedIn=false}
  cloudInit().then(()=>{if(CLOUD.mode!=='firebase'&&AUTH_RESOLVE){AUTH_RESOLVE();AUTH_RESOLVE=null}if(window.CONSOLE_ON)renderConsole(true)}).catch(()=>{if(AUTH_RESOLVE)AUTH_RESOLVE()});
  if(h.startsWith('admin')||h.startsWith('am-')){
    if(wide()){const pg=h.startsWith('admin-')?h.slice(6):'dashboard';enterConsole(AD().loggedIn?(CPAGE[pg]?pg:'dashboard'):'login',false);return}
    reset(AD().loggedIn?(R[h]&&h.startsWith('am-')&&!['am-request','am-approved','am-invited','am-logfail','am-visitor'].includes(h)?h:'am-home'):'am-login');return;
  }
  if(!FBCFG&&h&&R[h]&&h!=='splash'&&S.loggedIn&&!['send','sending','emitting'].includes(h)){hist=[{name:'home'}];if(h!=='home')hist.push({name:h,params:{}});render('fade')}
  else reset('splash');
})();
</script><script>if('serviceWorker' in navigator&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
